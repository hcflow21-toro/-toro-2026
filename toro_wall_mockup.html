<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Toro 生日應援祝福牆 — 模擬畫面</title>
<style>
  :root{
    --gold:#D9A857; --gold-light:#F1D9A6;
    --purple:#8B6FB3; --green:#7FA98A; --red:#C97B6E;
    --blue:#6F93B8; --indigo:#5E5E9C;
    --cream:#FBF4E8; --cream-2:#F5EBDA;
    --ink:#6B452C;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;background:#141018;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}

  #stage{
    width:100%;max-width:430px;height:100dvh;max-height:932px;
    position:relative;overflow:hidden;background:var(--cream);
    box-shadow:0 20px 60px rgba(0,0,0,.5);
  }
  @media (min-width:520px){
    #stage{height:min(844px, 96vh);border-radius:36px;margin:12px 0;}
  }

  /* ---------- PAGE 1: WALL ---------- */
  #wall{
    position:absolute;inset:0;overflow-y:auto;
    background:
      radial-gradient(circle at 15% 8%, rgba(217,168,87,.10), transparent 40%),
      radial-gradient(circle at 90% 90%, rgba(139,111,179,.10), transparent 45%),
      var(--cream);
    padding:28px 18px 90px;
    transition:opacity .6s ease, transform .6s ease;
  }
  #wall.hide{opacity:0;transform:scale(.97);pointer-events:none;}

  .wall-title{
    font-size:22px;color:var(--ink);font-weight:700;margin:4px 4px 2px;
    letter-spacing:.5px;
  }
  .wall-sub{font-size:12.5px;color:#B79671;margin:0 4px 20px;letter-spacing:.5px;}

  .heart-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:14px;
  }
  .heart-card{
    position:relative;aspect-ratio:1/1;border:none;cursor:pointer;
    background:none;padding:0;display:flex;align-items:flex-end;justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .heart-shape{
    position:relative;width:100%;height:100%;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    padding:16% 18% 10%;
    color:#fff;text-align:center;
    transition:transform .45s cubic-bezier(.22,.85,.3,1.05), filter .45s ease;
    filter:drop-shadow(0 6px 10px rgba(0,0,0,.15));
  }
  .heart-shape svg{position:absolute;inset:0;width:100%;height:100%;z-index:0;}
  .heart-shape .heart-snip,.heart-shape .heart-meta,.heart-shape .heart-count{position:relative;z-index:1;}
  .heart-card:active .heart-shape{transform:scale(.97);}
  .heart-card.opening .heart-shape{
    transform:translateY(-10px) scale(1.12);
    filter:drop-shadow(0 14px 22px rgba(0,0,0,.28)) brightness(1.15) saturate(1.1);
  }
  .h-gold .heart-shape svg{fill:#D9A857;}
  .h-purple .heart-shape svg{fill:#8B6FB3;}
  .h-green .heart-shape svg{fill:#7FA98A;}
  .h-red .heart-shape svg{fill:#C97B6E;}
  .h-blue .heart-shape svg{fill:#6F93B8;}
  .h-indigo .heart-shape svg{fill:#5E5E9C;}

  .sparkle{
    position:absolute;pointer-events:none;border-radius:50%;
    background:radial-gradient(circle,#fff8dd 0%,rgba(255,248,221,0) 70%);
    animation:sparkleOut .9s ease-out forwards;
  }
  @keyframes sparkleOut{
    0%{opacity:0;transform:scale(0) translateY(0);}
    25%{opacity:1;}
    70%{opacity:.8;}
    100%{opacity:0;transform:scale(1) translateY(-26px);}
  }

  .wall-hint{
    text-align:center;margin:0 0 18px;
    font-size:11px;letter-spacing:1px;color:rgba(217,168,87,.75);
  }

  /* ---------- ENVELOPE-OPEN TRANSITION (heart -> letter) ---------- */
  .flip-envelope{
    position:absolute;z-index:20;pointer-events:none;
    transition:left .62s cubic-bezier(.32,.86,.28,1), top .62s cubic-bezier(.32,.86,.28,1),
               width .62s cubic-bezier(.32,.86,.28,1), height .62s cubic-bezier(.32,.86,.28,1);
  }
  .flip-heart{position:absolute;inset:0;transition:opacity .4s ease .12s, transform .4s ease .12s;}
  .flip-heart svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 16px rgba(0,0,0,.25));}
  .flip-active .flip-heart{opacity:0;transform:scale(.7);}

  .flip-flap{
    position:absolute;top:6%;width:42%;height:34%;
    clip-path:polygon(0 100%, 100% 100%, 50% 0);
    -webkit-clip-path:polygon(0 100%, 100% 100%, 50% 0);
    transform-origin:50% 100%;
    transition:transform .5s cubic-bezier(.3,.8,.3,1) .05s, opacity .5s ease .25s;
  }
  .flap-left{left:5%;}
  .flap-right{right:5%;}
  .flip-active .flap-left{transform:rotate(-58deg) translate(-18%,-6%);opacity:0;}
  .flip-active .flap-right{transform:rotate(58deg) translate(18%,-6%);opacity:0;}

  .flip-letter{
    position:absolute;inset:0;border-radius:5px;overflow:hidden;
    background-image:url('data:image/jpeg;base64,__LETTER_B64__');
    background-size:cover;background-position:center;
    box-shadow:0 16px 34px rgba(0,0,0,.4);
    opacity:0;transform:scale(.55) translateY(10%);
    transition:opacity .5s ease .18s, transform .55s cubic-bezier(.2,.85,.3,1.1) .18s;
  }
  .flip-active .flip-letter{opacity:1;transform:scale(1) translateY(0);}

  .heart-card.sending{visibility:hidden;}

  /* ---------- PAGE 2: DETAIL ---------- */
  #detail{
    position:absolute;inset:0;opacity:0;visibility:hidden;
    overflow:hidden;
    transform:scale(1.04);
    transition:opacity .7s ease, transform .7s cubic-bezier(.2,.8,.3,1);
  }
  #detail.show{opacity:1;visibility:visible;transform:scale(1);}

  /* Base ambience: always fills the whole screen, independent of the photo, so there is
     never a "hole" if the photo is short. Deep purple stage-light gradient + soft glows. */
  .detail-bg-gradient{
    position:absolute;inset:0;z-index:0;
    background:linear-gradient(180deg,#271c3d 0%,#1c1430 40%,#120c20 75%,#0a0714 100%);
  }
  .bokeh-layer{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden;}
  .bokeh-layer span{
    position:absolute;border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.55) 0%, rgba(200,180,255,.18) 55%, transparent 75%);
  }
  .bokeh-layer span:nth-child(1){width:10px;height:10px;left:10%;top:8%;}
  .bokeh-layer span:nth-child(2){width:5px;height:5px;left:78%;top:5%;background:radial-gradient(circle, rgba(230,190,140,.6) 0%, transparent 75%);}
  .bokeh-layer span:nth-child(3){width:16px;height:16px;left:85%;top:16%;}
  .bokeh-layer span:nth-child(4){width:6px;height:6px;left:18%;top:22%;background:radial-gradient(circle, rgba(230,190,140,.6) 0%, transparent 75%);}
  .bokeh-layer span:nth-child(5){width:9px;height:9px;left:60%;top:14%;}
  .bokeh-layer span:nth-child(6){width:5px;height:5px;left:32%;top:6%;}
  .bokeh-layer span:nth-child(7){width:12px;height:12px;left:6%;top:34%;background:radial-gradient(circle, rgba(230,190,140,.5) 0%, transparent 75%);}
  .bokeh-layer span:nth-child(8){width:7px;height:7px;left:90%;top:30%;}

  /* No photo on this screen anymore — just the ambient stage-light background, and the
     letter as the sole focus, centered and always at full, undistorted size. */
  .detail-content{
    position:absolute;inset:0;z-index:1;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:flex-start;
    /* generous, fixed clearance below the header (back button + counter) — the letter's top
       edge must never render underneath it */
    padding:calc(54px + env(safe-area-inset-top,0px)) 0 calc(16px + env(safe-area-inset-bottom,0px));
    box-sizing:border-box;
  }
  .detail-content::-webkit-scrollbar{display:none;}

  .detail-overlay{
    position:absolute;inset:0;z-index:2;pointer-events:none;
    background:linear-gradient(180deg, rgba(20,14,32,.05) 0%, rgba(20,14,32,.3) 40%, rgba(10,7,18,.72) 100%);
  }

  .detail-header{
    position:absolute;top:0;left:0;right:0;z-index:15;
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(14px + env(safe-area-inset-top,0px)) 16px 10px;
    opacity:0;pointer-events:none;
    transition:opacity .5s ease;
  }
  .detail-header.show{opacity:1;pointer-events:auto;}
  .back-btn{
    width:36px;height:36px;border-radius:50%;border:none;
    background:rgba(20,14,32,.45);backdrop-filter:blur(4px);
    color:#fff;font-size:17px;display:flex;align-items:center;justify-content:center;
    cursor:pointer;
  }
  .counter{color:rgba(255,255,255,.8);font-size:12.5px;letter-spacing:.5px;}

  /* The letter, front and center — full-page, always its true, undistorted proportions. */
  .letter-wrap{
    width:86%;max-width:360px;flex:0 0 auto;
    display:flex;flex-direction:column;align-items:center;
  }
  .letter-heart{
    width:28px;height:28px;margin-bottom:-2px;z-index:2;
    filter:drop-shadow(0 4px 8px rgba(0,0,0,.35));
  }
  .letter-heart svg{width:100%;height:100%;display:block;}
  /* the card IS the scroll container now — one element, not two nested — so there's no
     absolute-inside-aspect-ratio interaction that can silently fail to size itself. */
  /* NEVER cap this box's height independently of its width — the paper image's aspect
     ratio (700:990) must always be honored exactly, or background-size:cover crops the
     artwork. If space is tight, .letter-wrap's width (set below) is what adapts, never this. */
  .letter-card{
    position:relative;width:100%;aspect-ratio:700/986;border-radius:6px;
    background-size:cover;background-position:center;
    box-shadow:0 18px 40px rgba(0,0,0,.45);
    overflow:hidden;
    transition:aspect-ratio .3s ease;
  }
  /* The actual scrollable reading area — a precisely measured rectangle that sits entirely
     within the plain center of the paper, clear of every corner illustration and scattered
     star/heart on the border, at any scroll position, for any length of message. top/bottom
     here are percentages of the card's real HEIGHT (correct for absolute positioning),
     which is what padding (always width-relative) could never express correctly. */
  /* 抬頭（固定）— sits right below the top illustrations, never scrolls */
  .letter-header{
    position:absolute;left:16%;right:16%;top:23%;
  }
  /* 內容（可滑動）— the only part that scrolls; bounded well clear of every decoration */
  .letter-inner{
    position:absolute;left:16%;right:29%;top:36%;bottom:28%;
    overflow-y:auto;overflow-x:hidden;
    -webkit-overflow-scrolling:touch;touch-action:pan-y;
    scrollbar-width:none;-ms-overflow-style:none;
  }
  .letter-inner::-webkit-scrollbar{display:none;}
  /* 署名（固定）— sits just above the bottom-right fish, right-aligned, never touching it */
  /* Positioned BESIDE the fish (same vertical level, to its left), not above it — the fish
     sits at roughly x:69%-100%, y:66%-81% of the paper, so the signature's right edge stops
     at 33% from the right (well before the fish begins) while sitting at its vertical center. */
  .letter-sign-fixed{
    position:absolute;left:16%;right:29%;top:74%;
    text-align:right;font-size:12.5px;color:var(--ink);opacity:.85;
  }
  .letter-eyebrow{font-size:9.5px;letter-spacing:2.5px;color:#B7895A;text-align:center;margin-bottom:6px;}
  .letter-title{font-size:16.5px;color:var(--ink);text-align:center;font-weight:700;margin-bottom:10px;}
  .letter-rule{width:46px;height:1px;background:#C9A46E;margin:0 auto 14px;}
  .letter-body{font-size:13.5px;line-height:1.9;color:var(--ink);white-space:pre-line;text-align:left;}


  .dots{
    position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:0;right:0;
    display:flex;justify-content:center;gap:6px;z-index:4;
  }
  .dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.35);}
  .dots span.active{background:rgba(255,255,255,.9);}

  /* ---------- PAPER PICKER ---------- */
  .paper-picker-btn{
    position:absolute;bottom:calc(34px + env(safe-area-inset-bottom,0px));right:16px;z-index:16;
    width:40px;height:40px;border-radius:50%;border:none;
    background:rgba(20,14,32,.5);backdrop-filter:blur(4px);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;cursor:pointer;
    opacity:0;pointer-events:none;transition:opacity .5s ease;
  }
  .paper-picker-btn.show{opacity:1;pointer-events:auto;}

  .paper-popover{
    position:absolute;bottom:calc(80px + env(safe-area-inset-bottom,0px));right:16px;z-index:16;
    display:flex;gap:10px;padding:10px;border-radius:16px;
    background:rgba(20,14,32,.55);backdrop-filter:blur(6px);
    opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .25s ease, transform .25s ease;
  }
  .paper-popover.show{opacity:1;transform:translateY(0);pointer-events:auto;}
  .paper-swatch{
    width:44px;height:44px;border-radius:10px;background-size:cover;background-position:center;
    border:2px solid transparent;cursor:pointer;padding:0;
  }
  .paper-swatch.active{border-color:#F1D9A6;}

</style>
</head>
<body>

<div id="stage">

  <!-- PAGE 1 -->
  <div id="wall">
    <div class="wall-title">祝福留言牆</div>
    <div class="wall-sub">選一顆愛心，看看大家寫給 Toro 的話</div>
    <div class="wall-hint">✦ 點擊愛心查看完整內容 ✦</div>
    <div class="heart-grid" id="heartGrid"></div>
  </div>

  <!-- PAGE 2 -->
  <div id="detail">
    <div class="detail-bg-gradient"></div>
    <div class="bokeh-layer"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <div class="detail-overlay"></div>
    <div class="detail-content" id="detailContent">
      <div class="letter-wrap">
        <div class="letter-heart" id="letterHeart"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50,88 C50,88 10,58 10,32 C10,15 25,5 40,10 C45,12 48,16 50,20 C52,16 55,12 60,10 C75,5 90,15 90,32 C90,58 50,88 50,88 Z"/></svg></div>
        <div class="letter-card">
          <div class="letter-header">
            <div class="letter-eyebrow">A MESSAGE FOR TORO</div>
            <div class="letter-title">給 Toro 的一封祝福</div>
            <div class="letter-rule"></div>
          </div>
          <div class="letter-inner" id="letterScroll">
            <div class="letter-body" id="letterBody"></div>
          </div>
          <div class="letter-sign-fixed" id="letterSign"></div>
        </div>
      </div>
    </div>
    <div class="dots" id="dots"></div>
    <button class="paper-picker-btn" id="paperPickerBtn">🎨</button>
    <div class="paper-popover" id="paperPopover"></div>
  </div>

  <!-- lives outside #detail's scroll container so it always stays put on screen -->
  <div class="detail-header" id="detailHeader">
    <button class="back-btn" id="backBtn">←</button>
    <div class="counter" id="counter">1 / 8</div>
  </div>

</div>

<script>
const messages = [{"color": "gold", "author": "匿名粉絲", "chars": 128, "text": "作詞：郭蕙的 作曲：彭宣欣 熱...\n\n從第一次聽到你的歌開始，\n你就像光一樣照亮了我很多的時刻。\n謝謝你用音樂陪伴我們的青春，\n也謝謝你總是這麼真誠、這麼努力。\n\n未來的每一天都要健康、平安、快樂，\n我們會一直在你身後，支持你、愛你。\n生日快樂，我們最喜歡的 Toro 🤍"}, {"color": "gold", "author": "匿名粉絲", "chars": 96, "text": "郭蕙的祝你 45 歲生日快樂，\n願願你身體健康、事事順心。\n\n這一路走來看著你的堅持與努力，\n真的很替你開心也很感動。\n希望你永遠保有現在的熱情與笑容，\n未來的舞台我們都會在。"}, {"color": "purple", "author": "嘿呼", "chars": 75, "text": "我們的碰是這樣子的人生觀光罷了，\n但因為有你，才讓平凡的日子多了很多期待。\n\n謝謝你一直用歌聲陪著我們走過高低起伏，\n生日快樂，願你一直被溫柔以待。"}, {"color": "gold", "author": "嘿嘿嘿", "chars": 62, "text": "我們的朋友們都在努力的努力不懈，\n希望你也能一直帶著這份熱情往前走。\n\n祝你生日快樂，健康平安，\n每一天都閃閃發光。"}, {"color": "green", "author": "嘿咻咻", "chars": 80, "text": "我要去看醫生的時候我們的朋友們都...\n\n即使生活忙碌，也沒有忘記要來留言祝福你，\n因為你的音樂一直是我們最好的陪伴。\n\n生日快樂，願你被這個世界溫柔對待。"}, {"color": "red", "author": "愛你愛到不怕死", "chars": 57, "text": "但你若聽哦我會更愛你\n\n每一次現場聽到你唱歌都覺得好幸福，\n希望你永遠健康快樂，\n我們會一直支持你、愛你。"}, {"color": "blue", "author": "Summer", "chars": 40, "text": "郭蕙的生日快樂 💙\n\n謝謝你這一年來的每一場表演，\n生日快樂，要開心健康喔。"}, {"color": "indigo", "author": "wiwi", "chars": 23, "text": "wuwin\n\n生日快樂，愛你，\n要一直幸福下去。"}];
const colorNames = {gold:'#E3B96A',purple:'#8B6FB3',green:'#7FA98A',red:'#C97B6E',blue:'#6F93B8',indigo:'#5E5E9C'};
const HEART_PATH = "M50,88 C50,88 10,58 10,32 C10,15 25,5 40,10 C45,12 48,16 50,20 C52,16 55,12 60,10 C75,5 90,15 90,32 C90,58 50,88 50,88 Z";

const grid = document.getElementById('heartGrid');
messages.forEach((m,i)=>{
  const btn = document.createElement('button');
  btn.className = 'heart-card h-'+m.color;
  btn.innerHTML = `
    <div class="heart-shape">
      <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="${HEART_PATH}"/></svg>
      <div class="heart-snip">${m.text.split('\n')[0]}</div>
      <div class="heart-meta">— ${m.author}</div>
      <div class="
    </div>`;
  btn.addEventListener('click', ()=>openHeart(i, btn));
  grid.appendChild(btn);
});

const wall = document.getElementById('wall');
const detail = document.getElementById('detail');
// The letter is always its full, correct, undistorted size now — no photo competing for
// space on this screen, nothing to measure or shrink. The header/content/signature zones
// are plain fixed CSS percentages (top/bottom on position:absolute correctly resolve
// against the real height), so no JS measurement is needed here.
const letterBody = document.getElementById('letterBody');
const letterSign = document.getElementById('letterSign');
const letterHeart = document.getElementById('letterHeart');
const counter = document.getElementById('counter');
const dotsWrap = document.getElementById('dots');
const letterScroll = document.getElementById('letterScroll');
let current = 0;

function spawnSparkles(btn){
  const rect = btn.getBoundingClientRect();
  const stageRect = document.getElementById('stage').getBoundingClientRect();
  for(let i=0;i<6;i++){
    const s = document.createElement('div');
    s.className = 'sparkle';
    const size = 4 + Math.random()*5;
    s.style.width = size+'px';
    s.style.height = size+'px';
    const x = rect.left - stageRect.left + rect.width*(0.2+Math.random()*0.6);
    const y = rect.top - stageRect.top + rect.height*(0.15+Math.random()*0.5);
    s.style.left = x+'px';
    s.style.top = y+'px';
    s.style.animationDelay = (i*0.06 + Math.random()*0.08)+'s';
    document.getElementById('stage').appendChild(s);
    setTimeout(()=>s.remove(), 1300);
  }
}

function openHeart(i, btn){
  const stage = document.getElementById('stage');

  btn.classList.add('opening');
  spawnSparkles(btn);

  setTimeout(()=>{
    const heartShape = btn.querySelector('.heart-shape');
    const stageRect = stage.getBoundingClientRect();
    const r0 = heartShape.getBoundingClientRect();

    loadMessage(i);
    const letterCard = document.querySelector('.letter-card');
    const r1 = letterCard.getBoundingClientRect();

    const flip = document.createElement('div');
    flip.className = 'flip-envelope';
    flip.style.left = (r0.left - stageRect.left) + 'px';
    flip.style.top = (r0.top - stageRect.top) + 'px';
    flip.style.width = r0.width + 'px';
    flip.style.height = r0.height + 'px';
    const heartColor = colorNames[messages[i].color];
    flip.innerHTML = `
      <div class="flip-heart"><svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="${HEART_PATH}" fill="${heartColor}"/></svg></div>
      <div class="flip-flap flap-left" style="background:${heartColor}"></div>
      <div class="flip-flap flap-right" style="background:${heartColor}"></div>
      <div class="flip-letter"></div>
    `;
    stage.appendChild(flip);

    btn.classList.add('sending');

    wall.classList.add('hide');
    detail.classList.add('show');
    document.getElementById('detailHeader').classList.add('show');
    document.getElementById('paperPickerBtn').classList.add('show');

    requestAnimationFrame(()=>{
      flip.classList.add('flip-active');
      flip.style.left = (r1.left - stageRect.left) + 'px';
      flip.style.top = (r1.top - stageRect.top) + 'px';
      flip.style.width = r1.width + 'px';
      flip.style.height = r1.height + 'px';
    });

    setTimeout(()=>{
      flip.remove();
      btn.classList.remove('opening');
      btn.classList.remove('sending');
    }, 680);

  }, 420);
}

function loadMessage(i){
  current = (i+messages.length)%messages.length;
  const m = messages[current];
  letterBody.textContent = m.text;
  letterSign.textContent = '— '+m.author;
  letterHeart.querySelector('path').setAttribute('fill', colorNames[m.color]);
  counter.textContent = (current+1)+' / '+messages.length;
  letterScroll.scrollTop = 0;
  fitLetterText();
  dotsWrap.innerHTML = '';
  const maxDots = Math.min(messages.length,5);
  for(let d=0; d<maxDots; d++){
    const sp = document.createElement('span');
    if(d === current % maxDots) sp.classList.add('active');
    dotsWrap.appendChild(sp);
  }
}

// Auto-shrink the message text to fit the fixed content box completely — for a normal-
// length message this means NOTHING is ever cut off and NOTHING needs to scroll; the whole
// letter is simply always shown in full, exactly as specified. Only if a message is so long
// that even a small readable size can't fit does the box fall back to its own internal
// scroll (overflow-y:auto is still there as a safety net for that rare case).
// One fixed font size for every message — consistent typography always. A message long
// enough to exceed the box simply scrolls within it (letter-inner's own overflow-y:auto),
// rather than shrinking its type size.
const FIXED_FONT = 13.5;
function fitLetterText(){
  letterBody.style.fontSize = FIXED_FONT + 'px';
}

let currentPaper = 0;
const letterCardBg = document.querySelector('.letter-card');
const paperPopover = document.getElementById('paperPopover');
const paperPickerBtn = document.getElementById('paperPickerBtn');

function applyPaper(i){
  currentPaper = i;
  const p = PAPERS[i];
  letterCardBg.style.backgroundImage = `url('data:image/jpeg;base64,${p.b64}')`;
  letterCardBg.style.aspectRatio = p.aspect;
  paperPopover.querySelectorAll('.paper-swatch').forEach((el,idx)=>{
    el.classList.toggle('active', idx===i);
  });
}

PAPERS.forEach((p,i)=>{
  const sw = document.createElement('button');
  sw.className = 'paper-swatch' + (i===0 ? ' active' : '');
  sw.style.backgroundImage = `url('data:image/jpeg;base64,${p.b64}')`;
  sw.title = p.label;
  sw.addEventListener('click', ()=> applyPaper(i));
  paperPopover.appendChild(sw);
});
applyPaper(0);

paperPickerBtn.addEventListener('click', ()=>{
  paperPopover.classList.toggle('show');
});

document.getElementById('backBtn').addEventListener('click', ()=>{
  detail.classList.remove('show');
  document.getElementById('detailHeader').classList.remove('show');
  document.getElementById('paperPickerBtn').classList.remove('show');
  paperPopover.classList.remove('show');
  setTimeout(()=> wall.classList.remove('hide'), 60);
});

// Swipe to change message works anywhere on the detail screen — over the letter, the
// background, wherever — but only when the gesture is clearly more horizontal than
// vertical, so scrolling through a long message (a vertical drag on the letter) is left
// alone. Uses Pointer Events, not touch events, so it works identically for a finger on a
// phone AND a mouse click-drag on desktop (touch events never fire for a mouse at all).
let dragStartX = null, dragStartY = null, dragActive = false;
detail.addEventListener('pointerdown', e=>{
  dragStartX = e.clientX;
  dragStartY = e.clientY;
  dragActive = true;
});
detail.addEventListener('pointerup', e=>{
  if(!dragActive || dragStartX===null) return;
  dragActive = false;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if(Math.abs(dx) > 45 && Math.abs(dx) > Math.abs(dy) * 1.4){
    if(dx < 0) loadMessage(current+1); else loadMessage(current-1);
  }
  dragStartX = null; dragStartY = null;
});
detail.addEventListener('pointercancel', ()=>{ dragActive = false; dragStartX = null; });

loadMessage(0);
</script>
